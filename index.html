<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Game Log - Cerca videogiochi</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Game Log</h1>
            <p>Lista titoli</p>
        </header>
        <main>
            <form role="search" id="modulo-ricerca" class="filtri">
                <div class="campo"> 
                    <label for="ricerca">Cerca per titolo</label>
                    <input type="search" id="ricerca">   
                </div>
                <div class="campo"> 
                    <label for="filtro">Filtra per stato </label>
                    <select id="filtro">   
                    <option value="">Tutti</option>
                    <option value="Da giocare">Da giocare</option>
                    <option value="In corso">In corso</option>
                    <option value="Finito">Finito</option>
                    </select>
                </div>
            </form>
            <h2>Risultati</h2>
            <p id="contatore" aria-live="polite">Caricamento...</p>
            <ul id="lista-giochi" class="griglia"></ul>
        </main>
        <footer>
            <p>Giacomo Majolino</p>
            <a href="https://github.com/giamajo/game-log">Codice su GitHub</a>
        </footer>
    </body>
</html>
